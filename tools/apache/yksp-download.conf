# 観測生データ（YKSP）の配信（docs/design/data-delivery.md）。<...> は埋める（リポジトリには実際の値を書かない）。
# 仮機で動いている形（2026-11-10。docs/operation/server-setup-provisional.md の 5.2）。
#
# - https://<サーバー>/download を開くと、LDAP の Basic 認証の後、自分のフォルダ /download/<アカウント>/ へ転送する
# - /srv/download/<group>/ より下は、ログインした名前と <group>（= LDAP のアカウント名）が同じときだけ通す。
#   判定は URL ではなく、ファイルの実際の場所（DirectoryMatch）で行う（%2e%2e・// などの書き方で回り込ませない）
# - 頭の一覧（全員の <group> の名前）は見せない
# - 中は /srv/download/<group>/<project>/{otf,psw,logging}/（src/sam45compat/deliver.py が作る）
#
# 転送の作りで踏んだ穴（ほかの書き方にしない理由）:
# - <LocationMatch> の中の Redirect "/download/%{REMOTE_USER}/" は、名前が空のまま評価され /download// に飛んだ
# - <VirtualHost> の直下の RewriteCond %{LA-U:REMOTE_USER} は、ログインが 401 になった
# - <Directory> の中の RewriteRule は、FollowSymLinks か SymLinksIfOwnerMatch が無いと 403（AH00670）。
#   頭のフォルダだけ SymLinksIfOwnerMatch を許し、<group> より下は RewriteEngine Off にする
#   （下のフォルダにも書き換えの設定が引き継がれ、同じ理由で 403 になるため）

Alias /download /srv/download

<Directory /srv/download>
    SSLRequireSSL

    AuthType Basic
    AuthName "File Download"
    AuthBasicProvider ldap
    # 絞り込み（<絞り込み>）に当てはまるアカウントだけがログインできる。
    # ldap:// は Apache と LDAP の間でパスワードが平文。LDAPS（ldaps://）か STARTTLS にできるなら、そうする
    AuthLDAPURL "ldap://<LDAP のサーバー>/<base DN>?uid?sub?<絞り込み>"
    # 検索に専用のアカウントが要るときだけ（パスワードはリポジトリに書かない）
    # AuthLDAPBindDN "<DN>"
    # AuthLDAPBindPassword "<パスワード>"

    # 書き換え（RewriteRule）に要るので、頭のフォルダだけ SymLinksIfOwnerMatch を許す
    Options +Indexes -FollowSymLinks +SymLinksIfOwnerMatch
    IndexOptions FancyIndexing NameWidth=* SuppressDescription
    AllowOverride None
    Require all denied

    # 頭（/download・/download/）: ログインした人を、自分のフォルダへ転送する。
    # <Directory> の中の書き換えはログインの後に動くので、REMOTE_USER に名前が入っている
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/download/?$
    RewriteCond %{REMOTE_USER} ^([A-Za-z0-9_][A-Za-z0-9_.+-]*)$
    RewriteRule ^ /download/%1/ [R=302,L]
</Directory>

# 頭の URL だけは、ログインした人なら通す（転送のため。一覧は出さない）
<LocationMatch "^/download/?$">
    Require valid-user
</LocationMatch>

# <group> より下: 自分のものだけ。シンボリックリンクはたどらず、書き換えも切る
<DirectoryMatch "^/srv/download/(?<grp>[^/]+)">
    Options -SymLinksIfOwnerMatch
    RewriteEngine Off
    Require expr "%{REMOTE_USER} == %{env:MATCH_GRP}"
</DirectoryMatch>
