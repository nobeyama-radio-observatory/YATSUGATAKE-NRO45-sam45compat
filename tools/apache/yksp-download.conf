# SPDX-License-Identifier: BSD-3-Clause
# 観測生データ（YKSP）の配信（docs/design/data-delivery.md）。
# HTTPS のサイトの <VirtualHost *:443> の中に入れる。<...> は埋める（リポジトリには実際の値を書かない）。
#
# - LDAP の Basic 認証。ログインした名前と <group>（= LDAP のアカウント名）が同じフォルダだけを通す
# - 判定は URL ではなく、ファイルの実際の場所（DirectoryMatch）で行う（%2e%2e・// などの書き方で回り込ませない）
# - 頭の /yksp/（全員の <group> の一覧）は 403
# - 観測者は https://<サーバー>/yksp/<アカウント>/ を開く
# - <ストレージ> は /srv/download（その下が <group>/<project>/{otf,psw,logging}/。src/sam45compat/deliver.py）

Alias /yksp/ "<ストレージ>/"

<Directory "<ストレージ>">
    AuthType Basic
    AuthName "YKSP"
    AuthBasicProvider ldap
    AuthLDAPURL "ldaps://<LDAP のサーバー>/<base DN>?uid"
    # 検索に専用のアカウントが要るときだけ（パスワードはリポジトリに書かない）
    # AuthLDAPBindDN "<DN>"
    # AuthLDAPBindPassword "<パスワード>"

    Options +Indexes -FollowSymLinks
    IndexOptions FancyIndexing NameWidth=* SuppressDescription
    AllowOverride None
    Require all denied
</Directory>

# <ストレージ>/<group>/ より下: ログインした名前と <group> が同じときだけ。
# <ストレージ> に . などの記号があるときは \. のようにエスケープする
<DirectoryMatch "^<ストレージ>/(?<grp>[^/]+)">
    Require expr "%{REMOTE_USER} == %{env:MATCH_GRP}"
</DirectoryMatch>
