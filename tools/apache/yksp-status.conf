# 暫定 LC と RFSoC の状態のページ・QL（docs/design/status-page.md）の Apache の設定。
# /etc/apache2/conf-available/yksp-status.conf に写し、a2enconf で有効にする（サーバー全体に効く。2026-11-12）。
#
# - 見る人は https://<サーバー>/status/・https://<サーバー>/ql/ で開く（既定の default-ssl.conf の 443 番。/download と同じ口）。
#   初めは所内 LAN 側の 80 番に別の VirtualHost を作るつもりだったが、仮機では使われず、443 番で見ていた（2026-11-12 に今の形に合わせた）
# - 見せる範囲は Apache では絞らない（2026-11-12 に決めた。ファイアウォールに任せる）。中身は表示だけで、操作の口は無い
# - status.json・ql.json は暫定 LC（User=yk）が書く（設定の status_path・ql_path）。Apache は配るだけ
# - 毎秒の読み込みを access.log に書かないため、default-ssl.conf の CustomLog の行に env=!nolog を足す（下の SetEnvIf と組で効く）

<Directory /var/www/html/status>
    # 1 秒ごとに読むので、途中で古いものを持たない
    <Files "status.json">
        Header set Cache-Control "no-store"
    </Files>
    # 書きかけ（status.json.tmp）は出さない
    <FilesMatch "\.tmp$">
        Require all denied
    </FilesMatch>
</Directory>

# QL: 状態のページと同じ扱い
<Directory /var/www/html/ql>
    <Files "ql.json">
        Header set Cache-Control "no-store"
        # ch を減らさずに送るので約 620 KB/秒。圧縮すると約 180 KB（2026-11-12。mod_deflate）
        SetOutputFilter DEFLATE
    </Files>
    <FilesMatch "\.tmp$">
        Require all denied
    </FilesMatch>
</Directory>

# 1 秒ごとの読み込みで access.log が膨れるので、status.json・ql.json は記録しない（CustomLog に env=!nolog が要る）
SetEnvIf Request_URI "^/(status/status|ql/ql)\.json" nolog
