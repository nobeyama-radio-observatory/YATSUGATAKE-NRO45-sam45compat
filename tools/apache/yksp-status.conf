# 暫定 LC と RFSoC の状態のページ（docs/design/status-page.md）。<...> は埋める（リポジトリには実際の値を書かない）。
# 所内 LAN から、認証なし・HTTP で見せる（2026-11-11 に決めた）。中身は表示だけで、操作の口は無い。
#
# - http://<サーバー>/ql/ を開くと QL（tools/ql/index.html を写したもの）が 1 秒ごとに ql.json（ql_path）を読む
# - http://<サーバー>/status/ を開くと index.html（tools/status/index.html を写したもの）が 1 秒ごとに status.json を読む。
#   頭（/）は /status/ へ転送する
# - status.json は暫定 LC（User=yk）が /var/www/html/status/ に書く（設定の status_path）。Apache は配るだけ
# - /var/www/html のほかのもの（apache2 が入れた既定の index.html など）は出さない
# - 待ち受けは所内 LAN 側の NIC の 80 番（ports.conf に Listen <所内 LAN 側の IP>:80 を足す）。
#   /download（LDAP・HTTPS）とは別の VirtualHost にし、こちらからは /download を出さない

<VirtualHost <所内 LAN 側の IP>:80>
    ServerName <サーバー>
    DocumentRoot /var/www/html
    RedirectMatch 302 ^/$ /status/

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/status>
        # 所内 LAN だけ（ファイアウォールとの二重の守り）
        Require ip <所内 LAN の範囲（例: 10.0.0.0/8）>
        # 1 秒ごとに読むので、途中で古いものを持たない
        <Files "status.json">
            Header set Cache-Control "no-store"
        </Files>
        # 書きかけ（status.json.tmp）は出さない
        <FilesMatch "\.tmp$">
            Require all denied
        </FilesMatch>
    </Directory>

    # QL: 状態のページと同じ扱い
    <Directory /var/www/html/ql>
        Require ip <所内 LAN の範囲（例: 10.0.0.0/8）>
        <Files "ql.json">
            Header set Cache-Control "no-store"
            # ch を減らさずに送るので約 620 KB/秒。圧縮すると約 180 KB（2026-11-12。mod_deflate）
            SetOutputFilter DEFLATE
        </Files>
        <FilesMatch "\.tmp$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/status-error.log
    # 1 秒ごとの読み込みで access.log が膨れるので、status.json は記録しない
    SetEnvIf Request_URI "^/(status/status|ql/ql)\.json" nolog
    CustomLog ${APACHE_LOG_DIR}/status-access.log combined env=!nolog
</VirtualHost>
